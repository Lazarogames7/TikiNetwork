name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m py_compile ciberfox.py lab/*.py
      - name: Run 42 tests
        run: python ciberfox.py test
      - name: Generate offline demo
        run: python ciberfox.py demo --out ci_demo
      - name: Validate committed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("lab_result/resumen.json"), Path("demo_result/simulation.json")):
              data = json.loads(path.read_text())
              assert "SIMULAD" in json.dumps(data, ensure_ascii=False).upper()
          PY
      - name: Reproduce hackathon metrics
        run: python docs/hackathon/calcular.py
      - name: Ensure generated results are committed
        run: git diff --exit-code -- docs/hackathon/resultados.json
